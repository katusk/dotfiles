# tmux-yank ersatz for Linux only             copy-pipe only in tmux 1.8=<
#-------------------------------------------------------------------------
# new key binding syntax using -T in tmux 2.4=<
if-shell "command -v xclip >/dev/null 2>&1" "bind-key -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard'"
if-shell "command -v xsel >/dev/null 2>&1"  "bind-key -T copy-mode-vi y send-keys -X copy-pipe 'xsel -ib'"
